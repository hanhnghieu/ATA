<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATA Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Bố cục: khung bản vẽ 3D bên trái, sổ tra cứu chương ATA bên phải; màn hẹp thì xếp dọc. */
:root{
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#E4E9EC;
  --panel:#F4F7F8;
  --stage:#D6DEE3;
  --ink:#101C26;
  --muted:#52656F;
  --line:#B6C2C9;
  --chip:#E2E9ED;
  --accent:#D1410C;
  --on-accent:#FFFFFF;
  --warn-bg:#FDEEE4;
  --warn-ink:#8F2E06;
  --warn-line:#EDB794;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1219; --panel:#101C26; --stage:#070E14; --ink:#E2E9ED; --muted:#93A5B1;
    --line:#26363F; --chip:#182733; --accent:#FF7A3D; --on-accent:#1A0D05;
    --warn-bg:#2A1A10; --warn-ink:#FFB48A; --warn-line:#5A3520;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1219; --panel:#101C26; --stage:#070E14; --ink:#E2E9ED; --muted:#93A5B1;
  --line:#26363F; --chip:#182733; --accent:#FF7A3D; --on-accent:#1A0D05;
  --warn-bg:#2A1A10; --warn-ink:#FFB48A; --warn-line:#5A3520;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 16px;
  display:flex;flex-direction:column;gap:12px;min-height:0;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap}
h1{margin:0;font:600 30px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.sub{font:400 12px/1.4 var(--font-mono);color:var(--muted);letter-spacing:.02em;min-width:0}
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,410px);gap:16px}
.stage{position:relative;min-width:0;min-height:0;background:var(--stage);border:1px solid var(--line);overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c.grabbing{cursor:grabbing}
#c.over{cursor:pointer}
.toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.toolbar>*{pointer-events:auto}
.btn{
  font:500 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;
  padding:9px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  cursor:pointer;border-radius:2px;
}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slider{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);background:var(--panel);border-radius:2px;font:500 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.slider input{width:104px;accent-color:var(--accent);margin:0}
.block{
  position:absolute;right:12px;bottom:12px;width:min(300px,calc(100% - 24px));
  background:var(--panel);border:1px solid var(--line);font:400 11px/1.35 var(--font-mono);
  display:grid;grid-template-columns:auto minmax(0,1fr);
}
.block dt,.block dd{margin:0;padding:6px 9px;border-top:1px solid var(--line)}
.block dt:first-of-type,.block dd:first-of-type{border-top:0}
.block dt{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-right:1px solid var(--line)}
.block dd{color:var(--ink);overflow-wrap:anywhere}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.panel{min-width:0;min-height:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);padding:22px 20px 28px}
.panel h2{margin:0;font:600 36px/1.02 var(--font-display);letter-spacing:.01em;text-wrap:balance}
.lead{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.how{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:4px;font:400 12px/1.4 var(--font-mono);color:var(--muted)}
.how b{color:var(--ink);font-weight:600}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 4px}
.grouphead h3{margin:0;font:600 19px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.grouphead span{font:400 11px/1 var(--font-mono);color:var(--muted);letter-spacing:.06em}
.rows{display:grid;margin:0;padding:0;list-style:none}
.row{
  display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;
  text-align:left;padding:9px 6px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font:inherit;
}
.row:hover{background:var(--chip)}
.row .n{font:600 13px/1 var(--font-mono);letter-spacing:.04em}
.row .t{min-width:0}
.row .t b{font-weight:500;display:block}
.row .t small{display:block;color:var(--muted);font-size:12px}
.row .go{color:var(--muted);font:400 13px/1 var(--font-mono)}
.back{font:500 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:0 0 14px;cursor:pointer}
.back:hover{color:var(--ink)}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.badge{font:600 13px/1 var(--font-mono);letter-spacing:.05em;background:var(--accent);color:var(--on-accent);padding:5px 8px;border-radius:2px}
.grp{font:400 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.en{margin:4px 0 0;font:400 12px/1.4 var(--font-mono);color:var(--muted);letter-spacing:.02em}
.sum{margin:14px 0 0;max-width:62ch}
.panel h4{margin:24px 0 8px;padding-top:14px;border-top:1px solid var(--line);font:500 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.list{margin:0;padding-left:18px;display:grid;gap:4px}
.list li{padding-left:2px}
.specs{margin:0;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:0}
.specs dt,.specs dd{margin:0;padding:6px 0;border-top:1px solid var(--line)}
.specs dt:first-of-type,.specs dd:first-of-type{border-top:0}
.specs dt{color:var(--muted);padding-right:16px;font-size:13px}
.specs dd{font-size:14px}
.maint{margin:0;padding:0;list-style:none;display:grid}
.maint li{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.maint li:first-child{border-top:0}
.maint span.tk{min-width:0;flex:1}
.tag{flex:none;font:500 10.5px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:5px 6px;background:var(--chip);color:var(--ink);white-space:nowrap}
.safety{margin-top:22px;padding:12px 14px;background:var(--warn-bg);border:1px solid var(--warn-line)}
.safety b{display:block;font:600 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--warn-ink);margin-bottom:8px}
.safety ul{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--ink)}
.rels{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{font:500 12px/1 var(--font-mono);padding:8px 10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;border-radius:2px}
.chipbtn:hover{border-color:var(--ink)}
.note{margin:22px 0 0;font-size:12px;color:var(--muted);max-width:62ch}

.modes{display:flex;border:1px solid var(--line);background:var(--panel);border-radius:2px}
.seg{font:500 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg+.seg{border-left:1px solid var(--line)}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.no3d .toolbar,.no3d .block{display:none}
.srch{display:grid;gap:6px;margin:18px 0 0;font:500 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.srchmsg{margin:8px 0 0;color:var(--muted);font-size:13px}
.in{width:100%;font:400 14px/1.4 var(--font-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:9px 10px}
textarea.in{min-height:84px;resize:vertical}
.in::placeholder{color:var(--muted)}
.logbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0;padding:10px 12px;border:1px solid var(--line);background:var(--chip);font-size:13px}
.cnt{font:600 11px/1 var(--font-mono);background:var(--accent);color:var(--on-accent);padding:4px 6px;border-radius:2px;white-space:nowrap}
.defects{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.defect{border:1px solid var(--line);padding:11px 12px;background:var(--bg)}
.dhead{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.pill{font:600 10.5px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.sev-critical{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sev-major{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.st-closed{color:var(--muted)}
.dreg{font:600 12px/1 var(--font-mono)}
.dtext{margin:8px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.dmeta{margin:6px 0 0;font:400 11.5px/1.5 var(--font-mono);color:var(--muted);overflow-wrap:anywhere}
.dact{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--line);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.dupd{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.dupd summary{cursor:pointer;font:500 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dupd summary:hover{color:var(--ink)}
.dupd .fgrid{margin-top:10px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f{display:grid;gap:5px;font:500 11px/1.2 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.f.wide{grid-column:1/-1}
.defform{margin:14px 0 0;border:1px solid var(--line);padding:12px;min-width:0}
.defform legend{padding:0 6px;font:600 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.formmsg{margin:8px 0 0;font-size:13px;min-height:1em}
.formmsg.ok{font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.55;cursor:default}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{margin:0 0 4px;color:var(--muted);font-size:14px}
.refs dt{font:600 12px/1.5 var(--font-mono);color:var(--ink)}
.refs dd{color:var(--muted);font-size:13px}
@media (max-width:860px){
  html,body{height:auto}
  .app{grid-template-columns:minmax(0,1fr)}
  .stage{height:64vh;min-height:380px}
  .panel{overflow:visible}
  h1{font-size:26px}
}
@media (max-width:480px){
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .block{width:calc(100% - 24px)}
  .panel h2{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1>ATA Explorer</h1>
  <div class="sub">Airbus A320 · mô hình minh họa · tra cứu theo chương ATA 100</div>
  <div class="modes" role="group" aria-label="Chế độ sử dụng">
    <button class="seg" id="mHoc" type="button" aria-pressed="true">Học</button>
    <button class="seg" id="mKySu" type="button" aria-pressed="false">Kỹ sư</button>
  </div>
</header>

<div class="app">
  <section class="stage" id="stage" aria-label="Mô hình 3D máy bay">
    <canvas id="c" aria-label="Mô hình 3D máy bay. Kéo để xoay, bấm vào bộ phận để xem thông tin."></canvas>
    <div class="toolbar">
      <button class="btn" id="bExplode" type="button" aria-pressed="false">Tách rời</button>
      <label class="slider" for="sExplode">Mức tách <input id="sExplode" type="range" min="0" max="100" value="0"></label>
      <button class="btn" id="bXray" type="button" aria-pressed="false">Xuyên thấu</button>
      <button class="btn" id="bSpin" type="button" aria-pressed="false">Tự xoay</button>
      <button class="btn" id="bReset" type="button">Đặt lại góc nhìn</button>
    </div>
    <dl class="block" aria-live="polite">
      <dt>Chương</dt><dd id="tbCh">—</dd>
      <dt>Bộ phận</dt><dd id="tbName">Chưa chọn</dd>
      <dt>Trạng thái</dt><dd id="tbState">Lắp ráp</dd>
    </dl>
  </section>
  <aside class="panel" id="panel" aria-label="Thông tin chương ATA"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================ DỮ LIỆU CHƯƠNG ATA ============================ */
fetch("/api/chapters").then(function(r){
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}).then(function(PARTS){
var GROUPS = [
 {id:"sys", title:"Hệ thống máy bay", sub:"ATA 21 – 49"},
 {id:"str", title:"Cấu trúc", sub:"ATA 52 – 57"},
 {id:"pwr", title:"Động cơ", sub:"ATA 70 – 80"}
];
var GROUP_LABEL = {sys:"Hệ thống", str:"Cấu trúc", pwr:"Động cơ"};
var partMap = {};
PARTS.forEach(function(p){ partMap[p.id]=p; p.pieces=[]; p.mats=new Set(); });

/* ============================ 3D ============================ */
var stageEl = document.getElementById("stage");
var canvas = document.getElementById("c");
var panel = document.getElementById("panel");
var tbCh = document.getElementById("tbCh"), tbName = document.getElementById("tbName"), tbState = document.getElementById("tbState");
var bExplode = document.getElementById("bExplode"), sExplode = document.getElementById("sExplode");
var bXray = document.getElementById("bXray"), bSpin = document.getElementById("bSpin"), bReset = document.getElementById("bReset");

var sel = null, hover = null, xray = false, eT = 0, curE = 0, autoSpin = false;
var reduce = false;
try{ reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(err){}

function pad(n){ return "ATA " + n; }

/* ---------- Chế độ, dữ liệu hư hỏng, tiện ích ---------- */
var no3d = (typeof THREE === "undefined");
var mode = "hoc";
try{ if(localStorage.getItem("ata-mode")==="ky-su") mode = "ky-su"; }catch(err){}
var defects = [], defectsErr = "", logOpen = false, logAll = false, searchQ = "";
var SEV = {MINOR:"Nhẹ", MAJOR:"Đáng kể", CRITICAL:"Nghiêm trọng"};
var STA = {OPEN:"Đang mở", IN_PROGRESS:"Đang xử lý", DEFERRED:"Hoãn", CLOSED:"Đã đóng"};
var DOCS = [
 ["AMM","Sổ tay bảo dưỡng: quy trình tháo, lắp, thử, kiểm tra"],
 ["TSM","Sổ tay xử lý sự cố: tìm nguyên nhân từ cảnh báo, báo cáo hỏng"],
 ["IPC","Danh mục phụ tùng minh họa: số phụ tùng, vị trí lắp"],
 ["SRM","Sổ tay sửa chữa kết cấu: giới hạn hư hỏng, cách sửa"],
 ["WDM","Sơ đồ dây điện"],
 ["MPD","Chương trình bảo dưỡng: hạng mục và chu kỳ thực tế"],
 ["MEL / CDL","Điều kiện được khai thác khi hoãn sửa thiết bị hoặc thiếu chi tiết"]
];
function eng(){ return mode==="ky-su"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d"); }
function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; }
function fmtDate(iso){ try{ return new Date(iso).toLocaleString("vi-VN"); }catch(err){ return ""; } }
function api(url, opt){
  return fetch(url, opt).then(function(r){
    if(r.ok) return r.status===204 ? null : r.json();
    return r.json().catch(function(){ return {}; }).then(function(b){ throw new Error(b.message || ("HTTP "+r.status)); });
  });
}
function loadDefects(){
  return api("/api/defects").then(function(d){ defects = d; defectsErr = ""; }, function(e){ defects = []; defectsErr = e.message; });
}
function openCount(no){
  var n = 0;
  defects.forEach(function(d){ if(d.status!=="CLOSED" && (no===undefined || d.chapterNo===no)) n++; });
  return n;
}
function syncModeBtns(){
  document.getElementById("mHoc").setAttribute("aria-pressed", eng() ? "false" : "true");
  document.getElementById("mKySu").setAttribute("aria-pressed", eng() ? "true" : "false");
}
function refresh(){
  if(logOpen && eng()) renderLog();
  else if(sel===null) renderIndex();
  else renderDetail(partMap[sel]);
}
function setMode(m){
  mode = m;
  try{ localStorage.setItem("ata-mode", m); }catch(err){}
  syncModeBtns(); logOpen = false; refresh();
  if(eng()) loadDefects().then(function(){ if(!panel.contains(document.activeElement)) refresh(); });
}
document.getElementById("mHoc").addEventListener("click", function(){ setMode("hoc"); });
document.getElementById("mKySu").addEventListener("click", function(){ setMode("ky-su"); });

/* ---------- Panel ---------- */
function renderIndex(){
  var h = '<h2>Chương ATA</h2>';
  if(eng()){
    h += '<p class="lead">Chế độ Kỹ sư: tìm chương, xem tài liệu cần tra và ghi nhận hư hỏng. Nội dung ở đây chỉ để định hướng. Công việc thực tế phải theo AMM, SRM, TSM và MPD hiệu lực của đúng máy bay.</p>';
  } else {
    h += '<p class="lead">ATA 100 chia máy bay thành các chương đánh số. Mô hình này gắn từng bộ phận 3D với đúng chương của nó. Chọn một bộ phận trên mô hình hoặc trong danh sách để xem mô tả, thành phần và công việc bảo dưỡng.</p>' +
      '<ul class="how"><li><b>Kéo</b> để xoay · <b>cuộn</b> hoặc <b>chụm hai ngón</b> để thu phóng</li><li><b>Bấm</b> vào bộ phận để chọn · <b>Esc</b> để bỏ chọn</li><li><b>Tách rời</b> kéo các bộ phận ra, <b>Xuyên thấu</b> làm trong vỏ ngoài</li></ul>';
  }
  h += '<label class="srch" for="q">Tìm chương<input class="in" id="q" type="search" placeholder="Số chương hoặc tên: 32, 32-41-00, càng đáp" autocomplete="off" value="'+esc(searchQ)+'"></label>' +
       '<p class="srchmsg" id="qmsg" hidden>Không có chương nào khớp.</p>';
  if(eng()){
    h += '<div class="logbar"><span>'+(defectsErr ? 'Không tải được nhật ký: '+esc(defectsErr) : 'Hư hỏng chưa đóng: <b>'+openCount()+'</b>')+'</span><button class="btn" type="button" data-act="log">Xem nhật ký</button></div>';
  }
  GROUPS.forEach(function(g){
    var items = PARTS.filter(function(p){ return p.group===g.id; });
    h += '<div class="grp-block"><div class="grouphead"><h3>'+g.title+'</h3><span>'+g.sub+'</span></div><ul class="rows">';
    items.forEach(function(p){
      var c = eng() ? openCount(p.id) : 0;
      h += '<li data-id="'+p.id+'" data-q="'+esc(norm(p.id+" "+p.vi+" "+p.en))+'"><button class="row" type="button" data-id="'+p.id+'"><span class="n">'+p.id+'</span><span class="t"><b>'+esc(p.vi)+'</b><small>'+esc(p.en)+'</small></span><span class="go">'+(c ? '<span class="cnt" title="Hư hỏng chưa đóng">'+c+'</span> ' : '')+'→</span></button></li>';
    });
    h += '</ul></div>';
  });

function M(color, o){
  o = o || {};

    color:color, roughness:(o.r!==undefined?o.r:0.6), metalness:(o.m!==undefined?o.m:0.1),
    side:THREE.DoubleSide, transparent:true, opacity:(o.opacity!==undefined?o.opacity:1)
  });
  m.userData.base = m.opacity;
  m.userData.eBase = new THREE.Color(o.emissive||0x000000);
  m.userData.eiBase = o.ei!==undefined ? o.ei : (o.emissive?1:0);
  m.userData.xr = o.xr;
  m.emissive.copy(m.userData.eBase);
  m.emissiveIntensity = m.userData.eiBase;
  return m;
}
function mesh(g, m){ return new THREE.Mesh(g, m); }
function addPiece(id, obj, ex){
  obj.userData.base = obj.position.clone();
  obj.userData.ex = new THREE.Vector3(ex[0], ex[1], ex[2]);
  root.add(obj);
  var p = partMap[id]; p.pieces.push(obj);
  obj.traverse(function(o){
    if(o.isMesh){ o.userData.partId = id; pickables.push(o); p.mats.add(o.material); }
  });

}

var FUS = [[0,-6.05],[0.12,-6.0],[0.2,-5.6],[0.4,-4.8],[0.62,-3.6],[0.72,-2.4],[0.76,-1.0],[0.76,3.2],[0.72,4.4],[0.6,5.2]];
function rAt(x){
  for(var i=0;i<FUS.length-1;i++){
    var a=FUS[i], b=FUS[i+1];
    if(x>=a[1] && x<=b[1]) return a[0]+(b[0]-a[0])*(x-a[1])/(b[1]-a[1]);

}

function build(){

  /* ATA 53 Thân */
  var fusMat = M(0xF1F4F6, {r:0.45, m:0.15, xr:0.14}); themed.push([fusMat, skinLight, skinDark]);
  var frameMat = M(0x7F8E99, {r:0.7, m:0.3});

  fg.add(mesh(alongX(lathe(FUS, 56)), fusMat));
  for(var i=0;i<14;i++){
    var x = -3.6 + i*0.6;
    var tg = new THREE.TorusGeometry(rAt(x)-0.025, 0.012, 6, 44); tg.rotateY(Math.PI/2);
    fg.add(at(mesh(tg, frameMat), x, 0, 0));
  }
  addPiece(53, fg, [0,0,0]);

  var radMat = M(0x9AA8AE, {r:0.4, m:0.1, xr:0.2}); themed.push([radMat, 0x9FB0B8, 0x6E808B]);
  var dishMat = M(0xC4CCD2, {r:0.4, m:0.6});

  rg.add(mesh(alongX(lathe([[0.6,5.2],[0.5,5.5],[0.3,5.85],[0.1,6.1],[0,6.15]], 40)), radMat));

  rg.add(at(mesh(cylX(0.05,0.3), dishMat), 5.3,0,0));
  addPiece(34, rg, [1.9,0,0]);
  var pitMat = M(0xB8C2C9, {r:0.3, m:0.7});
  mirrored(34, [0.9,0.5,1.0], function(s){
    var g = new THREE.Group();
    g.add(at(mesh(cylZ(0.03,0.07), pitMat), 4.95,0.02,0.66));
    g.add(at(mesh(cylX(0.014,0.3), pitMat), 5.05,0.02,0.7));
    return g;
  });

  /* ATA 56 Cửa sổ */
  var glass = M(0x15222D, {r:0.15, m:0.6, emissive:0x0A2A44, ei:0.5});
  mirrored(56, [0.7,0.9,0.9], function(s){
    var g = new THREE.Group();
    g.add(at(mesh(patch(0.655, 0.45, -1.3, 0.85), glass), 4.95,0,0));

  });
  var winGeo = new THREE.BoxGeometry(0.13,0.11,0.03);

    var im = new THREE.InstancedMesh(winGeo, glass, xs.length);

    xs.forEach(function(x,i){
      var r = rAt(x);
      var z = Math.sqrt(Math.max(r*r-0.04,0.01)) + 0.004;
      d.position.set(x,0.2,s*z); d.rotation.set(s>0?-0.27:0.27,0,0); d.updateMatrix();
      im.setMatrixAt(i, d.matrix);

  }
  door(3.9, 0.55, -0.5, 1.0, [0.5,0.3,1.5], [1,-1]);
  door(-3.35, 0.5, -0.5, 1.0, [-0.5,0.3,1.5], [1,-1]);

function placeCamera(){
  var ce = Math.cos(cam.el);
  camera.position.set(cam.tgt.x + cam.dist*ce*Math.cos(cam.az), cam.tgt.y + cam.dist*Math.sin(cam.el), cam.tgt.z + cam.dist*ce*Math.sin(cam.az));
  camera.lookAt(cam.tgt);
}
function resize(){
  var w = stageEl.clientWidth, h = stageEl.clientHeight;
  if(!w || !h) return;

  camera.updateProjectionMatrix();
}

/* ---------- Chọn, nổi bật, mờ ---------- */
var _b = new THREE.Box3(), _m4 = new THREE.Matrix4(), _v = new THREE.Vector3();
function partBox(p, e){
  var box = new THREE.Box3();
  p.pieces.forEach(function(o){ o.position.copy(o.userData.base).addScaledVector(o.userData.ex, e); });
  root.updateMatrixWorld(true);
  p.pieces.forEach(function(o){
    o.traverse(function(m){
      if(!m.isMesh) return;
      if(m.isInstancedMesh){
        for(var i=0;i<m.count;i++){ m.getMatrixAt(i,_m4); _m4.premultiply(m.matrixWorld); _v.setFromMatrixPosition(_m4); box.expandByPoint(_v); }
      } else {
        if(!m.geometry.boundingBox) m.geometry.computeBoundingBox();
        _b.copy(m.geometry.boundingBox).applyMatrix4(m.matrixWorld); box.union(_b);
      }
    });
  });
  p.pieces.forEach(function(o){ o.position.copy(o.userData.base).addScaledVector(o.userData.ex, curE); });
  root.updateMatrixWorld(true);
  return box;
}
function retarget(){
  if(sel!==null){
    var box = partBox(partMap[sel], eT);
    var c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
    cam.gTgt.copy(c);
    cam.gDist = Math.min(24, Math.max(7, sz.length()*1.05 + 4));
  } else {
    cam.gTgt.set(0,0,0); cam.gDist = defaultDist();
  }
}
function setHash(id){
  try{ if(id===null){ history.replaceState(null,"",location.pathname+location.search); } else { location.hash = "ata"+id; } }catch(err){}
}
function select(id){
  if(id!==null && !partMap[id]) id = null;
  sel = id; logOpen = false;
  refresh();
  if(!no3d) retarget();
  updateBlock(); setHash(sel);
}
function setHover(id){
  if(hover===id) return;
  hover = id;
  canvas.classList.toggle("over", id!==null);
  updateBlock();
}

var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(cx, cy){
  var r = canvas.getBoundingClientRect();
  ndc.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  var hits = ray.intersectObjects(pickables, false);
  if(!hits.length) return null;
  if(sel!==null){
    var own = hits.find(function(h){ return h.object.userData.partId===sel; });
    if(own) return own.object.userData.partId;
  }
  var h0 = hits[0];
  if(xray){
    var solid = hits.find(function(h){ return !h.object.material.userData.xr; });
    if(solid) h0 = solid;
  }
  return h0.object.userData.partId;
}

/* ---------- Điều khiển chuột/cảm ứng ---------- */
var pointers = new Map(), down = null, pinch = 0, lastMouse = null;
canvas.addEventListener("pointerdown", function(e){
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ down = {x:e.clientX, y:e.clientY, t:performance.now(), moved:0}; canvas.classList.add("grabbing"); }
  else { down = null; var a = Array.from(pointers.values()); pinch = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); }
});
canvas.addEventListener("pointermove", function(e){
  var p = pointers.get(e.pointerId);
  if(!p){ if(e.pointerType==="mouse") lastMouse = {x:e.clientX, y:e.clientY}; return; }
  var dx = e.clientX-p.x, dy = e.clientY-p.y;
  p.x = e.clientX; p.y = e.clientY;
  if(pointers.size===1){
    if(down) down.moved += Math.abs(dx)+Math.abs(dy);
    cam.az -= dx*0.006;
    cam.el = Math.max(-0.2, Math.min(1.45, cam.el + dy*0.006));
  } else if(pointers.size===2){
    var a = Array.from(pointers.values());
    var d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    if(pinch>0 && d>0){ cam.dist = Math.max(4.5, Math.min(36, cam.dist*pinch/d)); cam.gDist = cam.dist; }
    pinch = d;
  }
});
function endPointer(e){
  var had = pointers.has(e.pointerId);
  pointers.delete(e.pointerId);
  if(!had) return;
  canvas.classList.remove("grabbing");
  if(down && pointers.size===0 && down.moved<6 && performance.now()-down.t<500 && e.type==="pointerup"){
    var id = pick(e.clientX, e.clientY);
    select(id);
  }
  if(pointers.size<2) pinch = 0;
  if(pointers.size===0) down = null;
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", function(){ lastMouse = null; });
canvas.addEventListener("wheel", function(e){
  e.preventDefault();
  cam.dist = Math.max(4.5, Math.min(36, cam.dist*Math.exp(e.deltaY*0.0012)));
  cam.gDist = cam.dist;
}, {passive:false});
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && sel!==null) select(null); });

/* ---------- Vòng lặp vẽ ---------- */
var last = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now-last)/1000); last = now;
  var kE = reduce ? 1 : 1-Math.exp(-dt*4.5);
  curE += (eT-curE)*kE;
  if(Math.abs(eT-curE)<0.0005) curE = eT;
  PARTS.forEach(function(p){
    p.pieces.forEach(function(o){ o.position.copy(o.userData.base).addScaledVector(o.userData.ex, curE); });
  });
  fans.forEach(function(f){ f.rotation.x += dt*1.2; });

  if(lastMouse && pointers.size===0){ setHover(pick(lastMouse.x, lastMouse.y)); }
  else if(!lastMouse && pointers.size===0 && !panel.matches(":hover")) setHover(null);

  var pulse = 0.3 + 0.12*Math.sin(now*0.004);
  PARTS.forEach(function(p){
    var level = 0;
    if(p.id===sel) level = pulse; else if(p.id===hover) level = 0.4;
    var ghost = sel!==null && p.id!==sel;
    p.mats.forEach(function(m){
      var f = 1;
      if(m.userData.xr!==undefined && xray) f *= m.userData.xr;
      if(ghost) f *= 0.14;
      m.opacity = m.userData.base*f;
      m.depthWrite = m.opacity>0.95;
      if(level>0){ m.emissive.copy(accentC); m.emissiveIntensity = level; }
      else { m.emissive.copy(m.userData.eBase); m.emissiveIntensity = m.userData.eiBase; }
    });
  });

  var kC = reduce ? 1 : 1-Math.exp(-dt*5);
  if(autoSpin && pointers.size===0) cam.az += dt*0.3;
  cam.tgt.lerp(cam.gTgt, kC);
  cam.dist += (cam.gDist-cam.dist)*kC;
  placeCamera();
  updateBlockIfNeeded();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
var lastBlock = "";
function updateBlockIfNeeded(){
  var key2 = Math.round(curE*100)+"|"+Math.round(eT*100);
  if(key2!==lastBlock){ lastBlock = key2; updateBlock(); }
}

/* ---------- Khởi động ---------- */
syncModeBtns();
renderIndex();
var m0 = /^#ata(\d+)$/.exec(location.hash||"");
if(m0 && partMap[parseInt(m0[1],10)]) select(parseInt(m0[1],10));
if(eng()) loadDefects().then(function(){ if(!panel.contains(document.activeElement)) refresh(); });
updateBlock();
requestAnimationFrame(frame);
}, function(err){
  document.getElementById("panel").innerHTML = '<p class="note">Không tải được dữ liệu chương ATA từ máy chủ ('+err.message+'). Kiểm tra ứng dụng Spring Boot và kết nối PostgreSQL.</p>';
});
})();
</script>
